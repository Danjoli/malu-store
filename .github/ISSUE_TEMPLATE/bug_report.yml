name: Relatar um problema
description: Registre um comportamento incorreto ou inesperado.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Obrigado por ajudar a melhorar a Malu Store.
  - type: textarea
    id: description
    attributes:
      label: Descricao
      description: Explique claramente o problema encontrado.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Como reproduzir
      description: Liste os passos que levam ao problema.
      placeholder: |
        1. Acesse...
        2. Clique em...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamento esperado
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidencias e contexto
      description: Inclua mensagens de erro, capturas de tela e informacoes do ambiente, sem dados sensiveis.
  - type: checkboxes
    id: checks
    attributes:
      label: Verificacoes
      options:
        - label: Confirmei que nao existe outra Issue aberta para o mesmo problema.
          required: true
        - label: Removi senhas, tokens e dados pessoais das evidencias.
          required: true
