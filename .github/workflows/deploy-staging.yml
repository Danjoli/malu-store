name: Deploy de homologação

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Commit, branch ou tag a implantar
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  release:
    name: Validar e gerar release de homologação
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.release-meta.outputs.sha }}
    steps:
      - name: Baixar o commit solicitado
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0

      - name: Preparar PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite, sqlite3, gd, fileinfo
          coverage: none
          tools: composer:v2

      - name: Preparar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Instalar e validar
        shell: bash
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          npm ci
          cp .env.example .env
          php artisan key:generate
          composer audit
          npm audit --audit-level=high
          vendor/bin/pint --test
          composer analyse
          npm run build
          php artisan test

      - name: Preparar artefato
        id: release-meta
        shell: bash
        run: |
          composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader
          rm -f .env
          release_sha="$(git rev-parse HEAD)"
          printf '%s\n' "$release_sha" > RELEASE_COMMIT
          printf 'sha=%s\n' "$release_sha" >> "$GITHUB_OUTPUT"
          tar --exclude=.git --exclude=node_modules --exclude=.env --exclude='storage/logs/*' -czf "$RUNNER_TEMP/malu-store-staging-${release_sha}.tar.gz" .
          mkdir -p .release
          mv "$RUNNER_TEMP/malu-store-staging-${release_sha}.tar.gz" .release/
          cd .release
          sha256sum "malu-store-staging-${release_sha}.tar.gz" > "malu-store-staging-${release_sha}.sha256"

      - name: Armazenar artefato imutável
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-${{ steps.release-meta.outputs.sha }}
          path: |
            .release/malu-store-staging-${{ steps.release-meta.outputs.sha }}.tar.gz
            .release/malu-store-staging-${{ steps.release-meta.outputs.sha }}.sha256
            scripts/deploy/activate-staging-release.sh
          retention-days: 14
          if-no-files-found: error

  deploy:
    name: Implantar e verificar homologação
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: https://staging.malu-store.com
    steps:
      - name: Baixar artefato validado
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: staging-${{ needs.release.outputs.sha }}

      - name: Preparar acesso seguro
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Enviar e ativar release
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.STAGING_SSH_HOST }}
          DEPLOY_PORT: ${{ secrets.STAGING_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_APP_ROOT: ${{ secrets.STAGING_APP_ROOT }}
        run: |
          release_sha="${{ needs.release.outputs.sha }}"
          archive="malu-store-staging-${release_sha}.tar.gz"
          checksum="malu-store-staging-${release_sha}.sha256"
          scp -P "$DEPLOY_PORT" ".release/$archive" ".release/$checksum" scripts/deploy/activate-staging-release.sh "$DEPLOY_USER@$DEPLOY_HOST:~/"
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "bash ~/activate-staging-release.sh '$archive' '$checksum' '$release_sha' '$STAGING_APP_ROOT'"

      - name: Verificar saúde externa
        shell: bash
        run: |
          for attempt in {1..10}; do
            if curl --fail --silent --show-error --max-time 10 https://staging.malu-store.com/up >/dev/null; then
              exit 0
            fi

            printf 'Health check externo indisponível (tentativa %s/10).\n' "$attempt"
            sleep 3
          done

          exit 1
