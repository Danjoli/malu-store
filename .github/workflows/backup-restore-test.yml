name: Teste de restauração de backup

on:
  schedule:
    - cron: '30 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore:
    name: Criar e restaurar backup isolado
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-password
          MYSQL_DATABASE: malu_source
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Baixar o código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Preparar bancos e credenciais temporárias
        shell: bash
        run: |
          mkdir -p storage/app/public backups
          printf 'imagem de teste\n' > storage/app/public/probe.txt
          printf '[client]\nhost=127.0.0.1\nport=3306\nuser=root\npassword=test-password\ndatabase=malu_source\n' > "$RUNNER_TEMP/mysql.cnf"
          printf 'test-only-encryption-key\n' > "$RUNNER_TEMP/backup.key"
          mysql --defaults-extra-file="$RUNNER_TEMP/mysql.cnf" -e 'CREATE TABLE backup_probe (id BIGINT PRIMARY KEY, value VARCHAR(50)); INSERT INTO backup_probe VALUES (1, "restored"); CREATE DATABASE malu_restore;'

      - name: Criar backup criptografado
        shell: bash
        env:
          BACKUP_DIR: ${{ github.workspace }}/backups
          BACKUP_MYSQL_CONFIG: ${{ runner.temp }}/mysql.cnf
          BACKUP_ENCRYPTION_KEY_FILE: ${{ runner.temp }}/backup.key
        run: bash scripts/backup/create-backup.sh

      - name: Restaurar em banco separado
        shell: bash
        env:
          BACKUP_MYSQL_CONFIG: ${{ runner.temp }}/mysql.cnf
          BACKUP_ENCRYPTION_KEY_FILE: ${{ runner.temp }}/backup.key
          RESTORE_UPLOADS_DESTINATION: ${{ runner.temp }}/restored-uploads
        run: |
          archive="$(find backups -maxdepth 1 -name '*.tar.gz.enc' -print -quit)"
          bash scripts/backup/restore-backup.sh "$archive" malu_restore
          test "$(mysql --defaults-extra-file="$RUNNER_TEMP/mysql.cnf" --database=malu_restore --batch --skip-column-names -e 'SELECT value FROM backup_probe WHERE id = 1')" = 'restored'
          cmp storage/app/public/probe.txt "$RUNNER_TEMP/restored-uploads/probe.txt"
