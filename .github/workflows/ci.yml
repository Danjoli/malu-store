name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Qualidade e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v7

      - name: Preparar o PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, gd, fileinfo
          coverage: none
          tools: composer:v2

      - name: Preparar o Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias PHP
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Instalar dependencias JavaScript
        run: npm ci

      - name: Preparar a aplicacao
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Verificar vulnerabilidades PHP
        run: composer audit

      - name: Verificar formatacao PHP
        run: vendor/bin/pint --test

      - name: Executar testes
        id: tests
        shell: bash
        run: |
          set -o pipefail
          php artisan test 2>&1 | tee test-output.log

      - name: Publicar diagnostico dos testes
        if: failure() && steps.tests.outcome == 'failure'
        shell: bash
        run: |
          {
            echo '## Falha nos testes'
            echo '```text'
            tail -n 120 test-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          tail -n 40 test-output.log | while IFS= read -r line; do
            echo "::error title=Teste no Linux::$line"
          done

      - name: Compilar frontend
        run: npm run build
