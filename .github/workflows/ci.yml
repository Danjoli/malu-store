name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Qualidade e testes (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Preparar o PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, sqlite3, gd, fileinfo
          coverage: none
          tools: composer:v2

      - name: Preparar o Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias PHP
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Instalar dependencias JavaScript
        run: npm ci

      - name: Preparar a aplicacao
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Verificar vulnerabilidades PHP
        run: composer audit

      - name: Verificar vulnerabilidades JavaScript
        run: npm audit --audit-level=high

      - name: Verificar formatacao PHP
        run: vendor/bin/pint --test

      - name: Executar analise estatica
        run: composer analyse

      - name: Compilar frontend
        run: npm run build

      - name: Executar testes
        id: tests
        shell: bash
        run: |
          set -o pipefail
          php artisan test 2>&1 | tee test-output.log

      - name: Publicar diagnostico dos testes
        if: failure() && steps.tests.outcome == 'failure'
        shell: bash
        run: |
          {
            echo '## Falha nos testes'
            echo '```text'
            tail -n 120 test-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          diagnostic="$(tail -n 120 test-output.log)"
          diagnostic="${diagnostic//'%'/'%25'}"
          diagnostic="${diagnostic//$'\r'/'%0D'}"
          diagnostic="${diagnostic//$'\n'/'%0A'}"
          echo "::error title=Teste no Linux::$diagnostic"

