name: Backup de produção

on:
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: production-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Criar backup criptografado
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    env:
      INCIDENT_TITLE: '[Produção] Falha no backup automático'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Preparar acesso seguro
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Criar e verificar backup
        id: backup
        continue-on-error: true
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            'bash "$HOME/domains/malu-store.com/public_html/scripts/backup/create-backup.sh"'

      - name: Registrar falha sem duplicar incidente
        if: steps.backup.outcome == 'failure'
        shell: bash
        run: |
          existing="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "$INCIDENT_TITLE in:title" \
            --json title \
            --jq "map(select(.title == env.INCIDENT_TITLE)) | length")"

          if [[ "$existing" == '0' ]]; then
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$INCIDENT_TITLE" \
              --label production \
              --label priority:high \
              --body "O backup diário criptografado falhou. Verifique espaço em disco, acesso ao MySQL e os arquivos de configuração protegidos. Execução: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi

          exit 1
